<!doctype html>
<html lang="es-CO">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO base: cada página puede sobreescribir title/description vía el componente <Seo> -->
    <title>BeautyCommerce | Maquillaje y skincare de lujo en Colombia</title>
    <meta
      name="description"
      content="Descubre BeautyCommerce: maquillaje, skincare, cuidado del cabello, uñas y labios de marcas premium, curados para ti. Envíos a toda Colombia, empaque de lujo y atención personalizada."
    />
    <meta
      name="keywords"
      content="maquillaje de lujo Colombia, skincare premium, cosméticos importados, cuidado del cabello, esmaltes de uñas, labiales de lujo, tienda de belleza online Colombia, rutina de belleza"
    />
    <meta name="author" content="BeautyCommerce" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.beautycommerce.co/" />
    <meta name="theme-color" content="#1a1714" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BeautyCommerce" />
    <meta property="og:locale" content="es_CO" />
    <meta
      property="og:title"
      content="BeautyCommerce | Maquillaje y skincare de lujo en Colombia"
    />
    <meta
      property="og:description"
      content="Maquillaje, skincare, cabello, uñas y labios de marcas premium. Envíos a toda Colombia."
    />
    <meta property="og:url" content="https://www.beautycommerce.co/" />
    <meta property="og:image" content="https://www.beautycommerce.co/og-cover.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="BeautyCommerce | Maquillaje y skincare de lujo en Colombia"
    />
    <meta
      name="twitter:description"
      content="Maquillaje, skincare, cabello, uñas y labios de marcas premium. Envíos a toda Colombia."
    />
    <meta name="twitter:image" content="https://www.beautycommerce.co/og-cover.jpg" />

    <!-- Tipografía editorial: Fraunces (titulares) + Inter (texto) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
